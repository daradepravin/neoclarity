version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: neoclarity-postgres
    environment:
      POSTGRES_DB: neoclarity
      POSTGRES_USER: neoclarity
      POSTGRES_PASSWORD: neoclarity_dev
    ports:
      - "5432:5432"
    volumes:
      - neoclarity_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoclarity"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: neoclarity-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/neoclarity
      DB_USERNAME: neoclarity
      DB_PASSWORD: neoclarity_dev
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-this-must-be-at-least-256-bits-long-for-hs256}
      JWT_EXPIRATION_MS: 86400000
      # Neo4j AuraDB
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      AGENT_BASE_URL: http://agent:8000
    ports:
      - "8080:8080"

  agent:
    build: ../neoclarity-agent
    container_name: neoclarity-agent
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
    ports:
      - "8000:8000"

volumes:
  neoclarity_pg_data:
