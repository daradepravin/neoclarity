spring:
  application:
    name: neoclarity-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neoclarity}
    username: ${DB_USERNAME:neoclarity}
    password: ${DB_PASSWORD:neoclarity_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema — Hibernate only validates
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:dev-only-change-me-this-must-be-at-least-256-bits-long-for-hs256}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

# ── FastAPI agent layer ──────────────────────────────────────────────────────
agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8000}
  analyze-path: /api/agent/analyze
  timeout-ms: ${AGENT_TIMEOUT_MS:10000}   # 10s — matches NFR Recommendation Generation < 10s

# ── Neo4j AuraDB (Household Digital Twin projection) ─────────────────────────
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:password}

logging:
  level:
    com.neoclarity: INFO
    org.springframework.security: WARN
